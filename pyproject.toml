[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomberg-api"
version = "0.1.1"
description = "Async Python client for the Atomberg public cloud API (fans, water purifiers, smart locks)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ratul BMG" }]
keywords = ["atomberg", "home-assistant", "smart-home", "iot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/ratulbmg/atomberg-api"
Issues = "https://github.com/ratulbmg/atomberg-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomberg_api = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
